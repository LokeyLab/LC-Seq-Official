# LC-Seq Configuration
#
# This is the canonical configuration file for LC-Seq analysis.
# All parameters for peak detection, classification, validation, pooling,
# and visualization are specified here.
#
# References: THEORY.md for mathematical specifications

# =============================================================================
# Analysis Settings
# =============================================================================
analysis:
  # Variant mode: how to handle positional variants
  # - individual: analyze each variant separately (default)
  # - pooled: aggregate variants
  # Reference: THEORY.md Section 4.2
  variant_mode: pooled

  # Hierarchy mode: compound relationship structure
  # - building_block: DAG with convergence at block granularity (default)
  #   (positional variants with same blocks converge)
  # - monomer: DAG with convergence at monomer granularity
  #   (positional variants with same monomers converge)
  #   (DOES NOT RESPECT SYNTHESIS PATHS)
  # Reference: THEORY.md Section 3.3, 4.2.2, 4.2.3
  hierarchy_mode: building_block

# =============================================================================
# Performance Settings
# =============================================================================
performance:
  # Number of parallel workers for peak detection
  # - null or 1: Sequential processing (default, safest)
  # - >1: Use specified number of parallel workers
  # - -1: Use all available CPU cores
  # Parallel processing provides 4-8x speedup for large datasets (1000+ compounds)
  num_workers: null

# =============================================================================
# Signal Preprocessing Parameters
# =============================================================================
preprocessing:
  # Enable signal preprocessing (baseline correction)
  # When enabled, creates "corrected" signal variant on chromatograms
  enabled: true

  # Baseline correction parameters
  # Uses local minima + smoothed spline fitting
  baseline_order: 3 # Order for local minima detection (higher = fewer minima)
  baseline_smoothing: null # Spline smoothing factor (null = auto)
  include_endpoints: true # Include start/end as virtual minima

# =============================================================================
# Peak Detection Parameters
# =============================================================================
detection:
  # Minimum persistence threshold for peak detection
  # Filters topologically insignificant peaks using persistent homology
  # Range: 0.01 - 0.1 (0.05 recommended, 5% of signal range)
  # Reference: THEORY.md Section 5.2
  min_persistence: 0.05

  # Significance level (false positive rate) for general peak acceptance
  # More permissive - accepts peaks for purity calculation
  # alpha = 0.01 means 1% chance of false positive per test
  # Uses Negative Binomial test (handles overdispersion)
  # Reference: THEORY.md Section 5.2
  alpha: 0.0001

  # Significance level for product peak selection (stricter)
  # Product candidates must have p_value < alpha_product
  # Stricter than alpha to ensure high confidence in product identification
  # Set equal to alpha to disable separate product filtering
  alpha_product: 0.0001

  # Prominence percentile threshold
  # Retains only the most prominent peaks (top X%)
  # 0.5 = retain top 50% most prominent peaks
  # 0.0 = disable (retain all peaks)
  # Lower value = more strict (fewer peaks retained)
  # Reference: THEORY.md Section 5.2.3
  prominence_percentile: 0.0

  # Local SNR filter threshold multiplier
  # Threshold = min(SNRs) + min_snr * std(SNRs)
  # Set > 0 to enable as additional filter
  min_snr: 0.00

  # Global baseline filter (in standard deviations)
  # Peak height must exceed: baseline + min_baseline_sds * noise_std
  # Disabled by default (0.0) - Z-score handles "above background" significance
  # Set > 0 to enable as additional filter
  # Reference: THEORY.md Section 5.1.2
  min_baseline_sds: 3.0

  # Sigma for sigma-clipping baseline estimation
  # Used to identify and exclude peaks when estimating baseline/noise
  # σ=2.0 corresponds to 95% confidence interval (standard outlier threshold)
  # Range: 1.0 (68% CI, permissive) to 3.0 (99.7% CI, strict)
  # Reference: THEORY.md Section 5.1
  sigma_clip_sigma: 2.0

  # Minimum dispersion parameter floor for NB significance testing
  # (Negative Binomial is the only significance testing method - it's the most principled)
  # Prevents numerical issues when r is very small.
  # r = 0.1 allows significant overdispersion (Var ≈ 10×Mean at μ=1)
  # r = 1e6 effectively forces Poisson-like behavior
  # Reference: THEORY.md Section 5.2
  min_dispersion_r: 1e6

  # Peak boundary detection method
  # - valley_or_5pct: use valleys, fallback to threshold (recommended)
  # - valley_only: require valley detection
  # - threshold_only: always use threshold
  # Reference: THEORY.md Section 5.2.4
  boundary_method: valley_or_5pct

  # Boundary threshold fraction (fraction of peak height)
  # Used when boundary_method includes threshold fallback
  # Reference: THEORY.md Section 5.2.4
  boundary_threshold_fraction: 0.05

  # Signal variant to use for detection
  # "corrected" = baseline corrected via local minima + spline (recommended when preprocessing enabled)
  # "raw" = no preprocessing
  signal_variant: corrected

  # Include rejected peaks in output
  # true = include peaks that failed significance tests (for debugging)
  # false = only include significant peaks (default)
  include_rejected: false

# =============================================================================
# Peak Classification Parameters
# =============================================================================
classification:
  # Truncation boundary margin (in seconds)
  # Product peaks must be this far beyond max(truncation_positions)
  # Accounts for retention time variability in peak matching
  # Reference: THEORY.md Section 5.4
  truncation_margin: 30.0

  # Peak matching tolerance (relative fraction)
  # Used for Hungarian algorithm and position matching
  # Relative tolerance: |measured - expected| / expected
  # Reference: THEORY.md Section 5.5
  peak_matching_tolerance: 0.01

  # Minimum threshold for Hungarian algorithm (fraction of signal length)
  # Accounts for discrete fractionation in LC-Seq
  # Reference: THEORY.md Section 5.5
  hungarian_min_threshold: 0.02

# =============================================================================
# Pooled Mode Parameters
# =============================================================================
pooling:
  # Correlation threshold for validity
  # Variants must have min(pairwise correlation) > threshold
  # 0.8 = strong similarity required (recommended)
  # 0.0 = disable correlation check (not recommended)
  # Reference: THEORY.md Section 4.2.3
  correlation_threshold: 0.8

  # Aggregation method for pooled signal
  # - mean: faster, smoother (recommended)
  # - median: more robust to outliers
  # Reference: THEORY.md Section 4.2.2
  aggregation_method: mean

# =============================================================================
# Validation Parameters
# =============================================================================
validation:
  # Purity threshold mode
  # Adaptive thresholds from dataset distribution
  # - auto: use P₂₅ percentile from dataset (default)
  # - strict: use P₅₀ percentile
  # - lenient: use P₁₀ percentile
  # - <float>: explicit threshold value (e.g., 0.75)
  # Reference: THEORY.md Section 6.4
  purity_threshold: auto

  # Signal-to-noise ratio threshold mode
  # Dataset-relative thresholds
  # - auto: use P₅₀ percentile from dataset (default)
  # - strict: use P₇₅ percentile
  # - lenient: use P₂₅ percentile
  # - <float>: explicit threshold value (e.g., 10.0)
  # Reference: THEORY.md Section 6.5
  snr_threshold: auto

  # Retention time precision (in minutes) for peak matching
  # Used in validation workflow for comparing expected vs observed RT
  retention_precision: 0.5

  # cLPE (chromatographic Linear Property-Elution) validation parameters
  # Used for LogK-based outlier detection when reference data is provided
  clpe:
    # Z-score threshold for outlier detection
    # Peaks with |z-score| > threshold are flagged as outliers
    # 2.5 = ~1.2% false positive rate (two-tailed)
    outlier_threshold: 2.5

    # Minimum compounds per scaffold group for model fitting
    # Groups smaller than this are skipped (insufficient data)
    min_group_size: 5

# =============================================================================
# Quality Filter Parameters (Pre-filtering)
# =============================================================================
quality_filter:
  # Replicate correlation filter
  # Positional variants (same block support sequence) are pseudo-replicates
  # Low correlation indicates quality issues (noise, failed synthesis)
  # Single-variant classes are always included (can't assess correlation)
  min_correlation: 0.8

  # Intensity filter
  # Filters compounds with low total signal (failed synthesis, sample loss)
  # - percentile: exclude bottom X% (e.g., 0.05 = bottom 5%)
  # - absolute: explicit minimum threshold (overrides percentile)
  intensity_percentile: 0.05
  intensity_absolute: null  # Set to override percentile

  # Noise filter
  # Ratio of baseline noise to median signal
  # High noise makes peak detection unreliable
  # null = disabled (default)
  max_noise_ratio: null

# =============================================================================
# Visualization Parameters
# =============================================================================
visualization:
  # Layout parameters
  layout:
    # Time conversion factor (seconds → minutes)
    seconds_per_minute: 60.0

    # Normal vertical spacing between compounds
    offset_spacing: 0.5

    # Extra spacing between different block support sequence groups
    group_spacing_extra: 1.0

  # Color parameters
  colors:
    # Use rainbow colormap by block support sequence
    # true = chemically identical compounds get same color
    # false = all signals and markers are black (publication-ready)
    use_colormap: true

  # Line styling parameters
  lines:
    # Default trace line width
    linewidth_default: 1.5

    # Reference compound line width (thicker for emphasis)
    linewidth_reference: 3.0

    # Trace transparency (1.0 = opaque, 0.0 = transparent)
    alpha_trace: 1.0

  # Marker parameters
  markers:
    # Peak marker size
    marker_size: 6

  # Text parameters
  text:
    # Sequence label font size
    label_fontsize: 10

    # Maximum label length before truncation
    label_max_length: 40

    # Number of characters to show when truncating
    label_truncate_length: 4

  # Figure dimensions
  figure:
    # Figure width in inches
    fig_width: 16

    # Base figure height
    fig_height_base: 4

    # Additional height per trace
    fig_height_per_trace: 0.4

    # Minimum figure height
    fig_height_min: 10
