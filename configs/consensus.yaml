# LC-Seq Consensus Mode Configuration
#
# Use this configuration when you have positional variants that should
# behave identically (same residue sequence, different positions).
#
# Consensus mode aggregates signals from variants, detects peaks on the
# consensus, then integrates on individual variants. Automatically falls
# back to individual mode if correlation < 0.8.
#
# See THEORY.md Section 4.2.8.1 for consensus workflow.

analysis:
  # Use consensus mode with automatic fallback
  variant_mode: consensus

  # Building-block hierarchy (standard)
  hierarchy_mode: block

detection:
  # Slightly lower persistence threshold for consensus
  # (aggregated signal may show clearer peaks)
  min_persistence: 0.04

  boundary_method: valley_or_5pct

validation:
  purity_threshold: auto
  snr_threshold: auto
