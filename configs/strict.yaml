# LC-Seq Strict Validation Configuration
#
# Use this configuration for high-confidence validation requirements.
# Employs stricter thresholds for purity and SNR.
#
# Good for:
# - Hit selection workflows
# - Quality control
# - Published datasets

analysis:
  variant_mode: individual
  hierarchy_mode: block

detection:
  # Higher persistence threshold = only strong peaks
  min_persistence: 0.08

  boundary_method: valley_or_5pct

validation:
  # Strict thresholds: P₅₀ for purity, P₇₅ for SNR
  purity_threshold: strict
  snr_threshold: strict
