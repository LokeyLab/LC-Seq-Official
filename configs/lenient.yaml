# LC-Seq Lenient Validation Configuration
#
# Use this configuration for exploratory analysis or lower-quality datasets.
# Employs lenient thresholds to maximize compound recovery.
#
# Good for:
# - Initial screening
# - Low-concentration samples
# - Exploratory analysis

analysis:
  variant_mode: individual
  hierarchy_mode: block

detection:
  # Lower persistence threshold = detect more peaks
  min_persistence: 0.03

  boundary_method: valley_or_5pct

validation:
  # Lenient thresholds: P₁₀ for purity, P₂₅ for SNR
  purity_threshold: lenient
  snr_threshold: lenient
